<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人工作台</title>
<style>
  :root{
    --bg:#f5f6f8;
    --card:#ffffff;
    --ink:#1f2430;
    --ink-soft:#5b6472;
    --ink-faint:#9aa1ad;
    --line:#e6e9ee;
    --line-soft:#f0f2f5;
    --accent:#2563eb;
    --accent-soft:#eaf0fe;
    --danger:#e5484d;
    --ok:#178a50;
    --surface:#fbfbfc;
    --surface-hover:#eef1f5;
    --hover:#1d52cc;
    --stripe:#f6f7f9;
    --toast-bg:#1f2430;
    --toast-fg:#ffffff;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.12);
    --radius:14px;
  }
  :root[data-theme="dark"]{
    --bg:#0e1116;
    --card:#171b22;
    --ink:#e6eaf1;
    --ink-soft:#a2abb8;
    --ink-faint:#6b7483;
    --line:#262c37;
    --line-soft:#1f242d;
    --accent:#5b8cff;
    --accent-soft:#1b2a4d;
    --danger:#ff6b6e;
    --ok:#34c07a;
    --surface:#1c222b;
    --surface-hover:#222936;
    --hover:#7ea5ff;
    --stripe:#161a20;
    --toast-bg:#e6eaf1;
    --toast-fg:#111111;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:15px}
  body{
    font-family:"Inter","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);
    transition:background .3s,color .3s;
    line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit;color:inherit}
  ::placeholder{color:var(--ink-faint)}

  /* icons */
  .ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;
      stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:-3px}

  .shell{max-width:1080px;margin:0 auto;padding:28px 22px 72px}

  /* header */
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
        flex-wrap:wrap;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:13px}
  .brand .logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#2563eb,#4f7cf0);
      display:flex;align-items:center;justify-content:center;color:#fff;
      box-shadow:0 6px 16px -6px rgba(37,99,235,.55);flex:none}
  .brand .logo svg{width:23px;height:23px}
  .brand h1{font-size:21px;font-weight:700;letter-spacing:-.2px}
  .brand p{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
  .head-right{display:flex;align-items:center;gap:14px;margin-left:auto}
  .theme-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
      background:var(--card);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;
      box-shadow:var(--shadow);transition:.15s;flex:none}
  .theme-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
  .theme-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;
      stroke-linecap:round;stroke-linejoin:round}
  .theme-btn .sun{display:none}
  :root[data-theme="dark"] .theme-btn .sun{display:block}
  :root[data-theme="dark"] .theme-btn .moon{display:none}
  .meta{text-align:right;font-size:12.5px;color:var(--ink-soft)}
  .meta .clock{font-variant-numeric:tabular-nums;font-size:22px;font-weight:650;
      color:var(--ink);letter-spacing:.2px}
  .meta .date{margin:2px 0}
  .sync{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-size:12px}
  .sync .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .sync.off{color:var(--ink-faint)}
  .sync.off .dot{background:var(--ink-faint);animation:none}
  .syncbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
      background:var(--card);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;
      box-shadow:var(--shadow);transition:.15s;flex:none}
  .syncbtn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
  .syncbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;
      stroke-linecap:round;stroke-linejoin:round}
  .syncpanel{position:fixed;top:76px;right:22px;width:324px;max-width:calc(100vw - 32px);
      background:var(--card);border:1px solid var(--line);border-radius:14px;
      box-shadow:var(--shadow);padding:16px;z-index:60;display:none}
  .syncpanel.open{display:block}
  .syncpanel h3{font-size:14px;font-weight:650;margin-bottom:2px}
  .syncpanel .sd{font-size:12px;color:var(--ink-faint);margin-bottom:8px;line-height:1.5}
  .syncpanel label{display:block;font-size:12px;color:var(--ink-soft);margin:10px 0 4px}
  .syncpanel input{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;
      font-size:13px;background:var(--surface)}
  .syncpanel input:focus{outline:none;border-color:var(--accent)}
  .syncrow{display:flex;gap:8px;margin-top:14px}
  .syncrow .btn{flex:1;justify-content:center;padding:9px 0}
  .syncmeta{margin-top:12px;font-size:11.5px;color:var(--ink-faint);line-height:1.6;word-break:break-all}
  .syncmeta b{color:var(--ok);font-weight:600}
  .syncpanel .hint{font-size:11.5px;color:var(--ink-faint);margin-top:10px;line-height:1.5;
      border-top:1px dashed var(--line);padding-top:10px}

  .searchbar{position:relative;margin-bottom:22px}
  .searchbar svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);
      width:17px;height:17px;color:var(--ink-faint)}
  .searchbar input{width:100%;padding:12px 14px 12px 42px;border:1px solid var(--line);
      border-radius:12px;background:var(--card);font-size:14px;box-shadow:var(--shadow);
      transition:border-color .15s}
  .searchbar input:focus{outline:none;border-color:var(--accent)}

  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
      box-shadow:var(--shadow);padding:18px;min-width:0}
  .c-h{grid-column:span 6}.c-q{grid-column:span 4}.c-t{grid-column:span 8}
  .c-3{grid-column:span 12}

  .card-h{display:flex;align-items:center;gap:9px;margin-bottom:13px}
  .card-h .live{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);
      color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
  .card-h .live svg{width:18px;height:18px}
  .card-h h2{font-size:15px;font-weight:650;letter-spacing:-.1px}
  .card-h .sub{font-size:11.5px;color:var(--ink-faint);margin-top:1px}
  .card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}

  /* quick launch */
  .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .qbtn{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:13px;
      border:1px solid var(--line);border-radius:11px;background:var(--surface);
      transition:.14s;text-align:left}
  .qbtn:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .qbtn .qic{width:34px;height:34px;border-radius:9px;background:var(--surface-hover);border:1px solid var(--line);
      color:var(--ink-soft);display:flex;align-items:center;justify-content:center}
  .qbtn .qic svg{width:17px;height:17px}
  .qbtn b{font-size:13px;font-weight:600}
  .qbtn span{font-size:11.5px;color:var(--ink-faint)}

  /* add row */
  .addrow{display:flex;gap:8px;margin:12px 0}
  .addrow input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:9px;
      font-size:13.5px;background:var(--surface)}
  .addrow input:focus{outline:none;border-color:var(--accent)}
  .btn{padding:9px 14px;border-radius:9px;font-size:13px;font-weight:600;
      background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:6px;
      transition:.14s;white-space:nowrap}
  .btn:hover{background:var(--hover)}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--danger);color:var(--danger)}
  .btn.tiny{padding:5px 9px;font-size:12px;border-radius:7px}

  .list{display:flex;flex-direction:column}
  .li{display:flex;align-items:center;gap:11px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:14px}
  .li:last-child{border-bottom:none}
  .li .check{width:19px;height:19px;border-radius:6px;border:1.6px solid var(--ink-faint);
      flex:none;display:flex;align-items:center;justify-content:center;transition:.14s;cursor:pointer}
  .li .check svg{width:12px;height:12px;stroke:#fff;stroke-width:2.6;fill:none;opacity:0}
  .li.done .check{background:var(--ok);border-color:var(--ok)}
  .li.done .check svg{opacity:1}
  .li.done .txt{color:var(--ink-faint);text-decoration:line-through}
  .li .txt{flex:1;word-break:break-word}
  .li .x{color:var(--ink-faint);opacity:0;transition:.14s}
  .li:hover .x{opacity:1}
  .li .x:hover{color:var(--danger)}
  .empty{color:var(--ink-faint);font-size:13px;text-align:center;padding:22px 0}

  /* pomodoro */
  .pomo{display:flex;flex-direction:column;align-items:center;padding:6px 0 4px}
  .modes{display:flex;gap:5px;background:var(--bg);padding:4px;border-radius:9px;margin-bottom:16px}
  .modes button{padding:6px 13px;border-radius:7px;font-size:12.5px;color:var(--ink-soft);font-weight:600}
  .modes button.on{background:var(--surface-hover);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .ring{position:relative;width:170px;height:170px}
  .ring svg{transform:rotate(-90deg)}
  .ring .track{stroke:var(--line)}
  .ring .bar{stroke:var(--accent);transition:stroke-dashoffset 1s linear,stroke .3s}
  .ring .time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
      justify-content:center;}
  .ring .time b{font-size:40px;font-weight:700;letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .ring .time span{font-size:11px;color:var(--ink-faint)}
  .pomo .go{margin-top:16px;padding:11px 40px;border-radius:99px;background:var(--accent);color:#fff;
      font-size:14.5px;font-weight:650;transition:.14s}
  .pomo .go:hover{background:var(--hover)}

  /* note card spans full-right below */
  .notearea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:10px;
      padding:10px 12px;resize:vertical;font-size:13.5px;background:var(--surface)}
  .notearea:focus{outline:none;border-color:var(--accent)}

  /* chip / tag pills (动态) */
  .tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .tab{padding:6px 13px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;
      color:var(--ink-soft);transition:.14s}
  .tab.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .feed{display:flex;flex-direction:column;gap:10px}
  .f-item{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--surface)}
  .f-item .fic{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;
      justify-content:center;color:#fff}
  .f-item .fic svg{width:17px;height:17px}
  .f-item .ft{font-size:13.5px;font-weight:600;margin-bottom:2px;line-height:1.4}
  .f-item .fd{font-size:12.5px;color:var(--ink-soft)}
  .f-item .fm{margin-top:6px;font-size:11.5px;color:var(--ink-faint)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
      padding:3px 9px;border-radius:99px;flex:none;height:fit-content}

  /* links */
  .links{display:flex;flex-wrap:wrap;gap:9px}
  .links a{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid var(--line);
      border-radius:10px;font-size:13px;background:var(--surface);transition:.14s}
  .links a:hover{border-color:var(--accent);color:var(--accent)}
  .links a svg{width:15px;height:15px}

  /* table */
  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
  .actions .btn{font-size:12.5px;padding:7px 12px}
  .actions input[type=text]{flex:1;min-width:140px;padding:8px 11px;border:1px solid var(--line);
      border-radius:9px;font-size:13px;background:var(--surface)}
  .actions input[type=text]:focus{outline:none;border-color:var(--accent)}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-weight:600;color:var(--ink-soft);background:var(--surface);font-size:12px}
  tr:nth-child(even) td{background:var(--stripe)}
  tr:last-child td{border-bottom:none}
  tr td.day{font-weight:600}
  .cellno td{color:var(--ink-faint);text-align:center;padding:26px 12px}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--toast-bg);
      color:var(--toast-fg);padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;
      transition:.25s;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media(max-width:900px){
    .c-h{grid-column:span 12}.c-q{grid-column:span 6}.c-t{grid-column:span 12}
    .quick{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:560px){
    .c-q{grid-column:span 12}.quick{grid-template-columns:1fr 1fr}
    .brand .meta{text-align:left}
  }
  .daycell{width:88px}
</style>
</head>
<body>
<div class="shell">

  <!-- header -->
  <header class="head">
    <div class="brand">
      <div class="logo">
        <svg class="ic" viewBox="0 0 24 24" stroke="currentColor" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></svg>
      </div>
      <div>
        <h1>个人工作台</h1>
        <p>自己搭的小面板</p>
      </div>
    </div>
    <div class="head-right">
      <button class="theme-btn" id="themeBtn" aria-label="切换深色 / 浅色" title="切换主题">
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24"><path d="M20 13.5A8 8 0 1 1 10.5 4 6.5 6.5 0 0 0 20 13.5z"/></svg>
      </button>
      <button class="syncbtn" id="syncBtn" aria-label="云端同步" title="云端同步">
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 13a7 7 0 0 1 13.3-3.4A4.5 4.5 0 0 1 16.5 18H7A4 4 0 0 1 4 13z"/><path d="M12 11v6M9.5 14.5 12 17l2.5-2.5"/></svg>
      </button>
      <div class="meta">
        <div class="clock" id="clock">--:--:--</div>
        <div class="date" id="date">--</div>
        <span class="sync" id="syncState"><span class="dot"></span>本地同步正常</span>
      </div>
    </div>
  </header>

  <!-- cloud sync panel -->
  <div class="syncpanel" id="syncPanel">
    <h3>云端同步</h3>
    <div class="sd">数据存你 GitHub 的私有仓库，用它连接电脑和手机，和你现有工作台互不干扰。</div>
    <label for="sOwner">仓库所有者（你的 GitHub 用户名）</label>
    <input id="sOwner" placeholder="例如 W-lik721">
    <label for="sRepo">数据仓库名（建议单独建一个私有仓库）</label>
    <input id="sRepo" placeholder="例如 workbench-sync-data">
    <label for="sToken">Token（细粒度令牌，仅授权该仓库读写）</label>
    <input id="sToken" type="password" placeholder="github_pat_... 或 ghp_...">
    <div class="syncrow">
      <button class="btn" id="sBackup">备份到云端</button>
      <button class="btn ghost" id="sPull">从云端拉取</button>
    </div>
    <div class="syncmeta" id="sMeta"></div>
    <div class="hint">Token 只存在本机的浏览器里，不会写进页面代码。注意：备份会把云端这份 <b>覆盖</b>，拉取会把本地这份 <b>覆盖</b>，先确认方向再点。</div>
  </div>

  <!-- search -->
  <div class="searchbar">
    <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
    <input id="search" type="text" placeholder="搜快捷入口，比如“抖音”…">
  </div>

  <div class="grid">

    <!-- Quick launch -->
    <section class="card c-3">
      <div class="card-h">
        <div class="live"><svg class="ic" viewBox="0 0 24 24"><path d="M13 3 4 14h6l-1 7 9-11h-6z"/></svg></div>
        <div><h2>快捷启动台</h2><div class="sub">常用的都放这儿了</div></div>
      </div>
      <div class="quick" id="quick"></div>
    </section>

    <!-- Todos -->
    <section class="card c-h">
      <div class="card-h">
        <div class="live"><svg class="ic" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 .8.8L6 5.2M3.5 12l.8.8L6 11.2M3.5 18l.8.8 1.7-1.6"/></svg></div>
        <div><h2>待办清单</h2><div class="sub">勾了就当完成</div></div>
        <div class="right"><button class="btn tiny ghost" id="clearTodos">清除已完成</button></div>
      </div>
      <div class="addrow">
        <input id="todoInput" placeholder="写一条待办，回车添加…">
        <button class="btn" id="addTodo"><svg class="ic" viewBox="0 0 24 24" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>添加</button>
      </div>
      <div class="list" id="todoList"></div>
    </section>

    <!-- Pomodoro -->
    <section class="card c-q">
      <div class="card-h">
        <div class="live"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M9 3h6M12 3v2M12 13l3-3"/></svg></div>
        <div><h2>专注计时</h2><div class="sub">一次只做一件事</div></div>
      </div>
      <div class="pomo">
        <div class="modes">
          <button data-m="5">5 分</button>
          <button data-m="15">15 分</button>
          <button data-m="25">25 分</button>
          <button data-m="45">45 分</button>
        </div>
        <div class="ring">
          <svg width="170" height="170" viewBox="0 0 170 170">
            <circle class="track" cx="85" cy="85" r="74" fill="none" stroke-width="10"/>
            <circle class="bar" id="ringBar" cx="85" cy="85" r="74" fill="none" stroke-width="10"
              stroke-linecap="round" stroke-dasharray="465" stroke-dashoffset="0"/>
          </svg>
          <div class="time"><b id="pomoTime">25:00</b><span id="pomoLabel">待开始</span></div>
        </div>
        <button class="go" id="pomoGo">开始专注</button>
      </div>
    </section>

    <!-- Note -->
    <section class="card c-3">
      <div class="card-h">
        <div class="live"><svg class="ic" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg></div>
        <div><h2>我的速记</h2><div class="sub">想到啥写啥</div></div>
        <div class="right"><button class="btn tiny ghost" id="clearNotes">清空</button></div>
      </div>
      <div class="addrow">
        <textarea id="noteInput" class="notearea" placeholder="随手记点东西，Ctrl / Cmd + Enter 保存…"></textarea>
        <div style="display:flex;flex-direction:column;gap:8px">
          <button class="btn" id="addNote">保存</button>
          <button class="btn ghost" id="aiSeed">今日灵感</button>
        </div>
      </div>
      <div class="list" id="noteList"></div>
    </section>

    <!-- Feed / dynamics -->
    <section class="card c-t">
      <div class="card-h">

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}

/* ===== 本地 key 隔离前缀（与同域名下其他工作台互不干扰）===== */
const P='wbm-';
(function migrate(){
  const pairs={'todos':'todos','notes':'notes','dynData':'dynData','sched':'sched'};
  Object.keys(pairs).forEach(k=>{
    const oldK=pairs[k];
    if(!localStorage.getItem(P+k)&&localStorage.getItem(oldK)!=null){
      try{
        const v=JSON.parse(localStorage.getItem(oldK));
        const hasData=!(Array.isArray(v)&&!v.length)&&!(v&&typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length);
        if(hasData){localStorage.setItem(P+k,localStorage.getItem(oldK));localStorage.removeItem(oldK)}
      }catch(e){}

  });
})();

const modeset={'5':5,'15':15,'25':25,'45':45};
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function paint(){const off=C*(1-left/total);$('#ringBar').style.strokeDashoffset=off;
  $('#pomoTime').textContent=fmt(left)}
function stop(){run=false;clearInterval(pid);$('#pomoGo').textContent='开始专注';$('#pomoLabel').textContent='还没开始'}

const DAYS=['周一','周二','周三','周四','周五','周六','周日'];

let sched=LS.get(P+'sched',{});
function empt(){const b=$('#schedBody');b.innerHTML='<tr class="cellno"><td colspan="5">还没有课程，粘贴或手填一节试试</td></tr>'}
function renderSched(){
  const keys=Object.keys(sched);
  if(!keys.length){empt();return}
  const b=$('#schedBody');b.innerHTML='';
  keys.forEach(dy=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="day">${dy}</td>`;
    for(let i=0;i<4;i++)tr.innerHTML+=`<td></td>`;
    const tds=tr.querySelectorAll('td');
    for(let i=1;i<5;i++)tds[i].textContent=sched[dy][i-1]||'';
    b.appendChild(tr);
  });
}
function parseRaw(){
  const v=$('#rawTable').value.trim();if(!v)return toast('先把内容粘进来');
  const lines=v.split(/\r?\n/).filter(l=>l.trim());
  lines.forEach(line=>{
    const cells=line.split(/[,\t|、]/).map(c=>c.trim());
    if(!cells.length)return;
    const day=cells[0];
    const arr=cells.slice(1,5);
    while(arr.length<4)arr.push('');
    // merge into existing day
    const cur=sched[day]||['','','',''];
    arr.forEach((c,i)=>{if(c)cur[i]=c});
    sched[day]=cur;
  });
  LS.set(P+'sched',sched);renderSched();$('#rawTable').value='';toast('课程表更新好了');
}

/* ===== 云端同步（GitHub 私有仓库） ===== */
const DATA_FILE='data.json';
const SYNC_KEY=P+'sync';
const API='https://api.github.com';
function getCfg(){return LS.get(SYNC_KEY,{})}
function readInputs(){
  const c=getCfg();
  return {owner:($('#sOwner').value||'').trim(),repo:($('#sRepo').value||'').trim(),
          token:($('#sToken').value||c.token||'').trim()};
}
function setStatus(html){$('#sMeta').innerHTML=html}
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
function dataUrl(cfg){return `${API}/repos/${cfg.owner}/${cfg.repo}/contents/${DATA_FILE}`}
function apiOpt(cfg,extra){return Object.assign(
  {headers:{Authorization:`Bearer ${cfg.token}`,Accept:'application/vnd.github+json'}},extra||{})}
function collect(){return {todos,notes,dynData,sched,
  savedAt:new Date().toISOString()}}
function apply(d){
  if(Array.isArray(d.todos)){todos=d.todos;LS.set(P+'todos',todos)}
  if(Array.isArray(d.notes)){notes=d.notes;LS.set(P+'notes',notes)}
  if(d.dynData){dynData=d.dynData;LS.set(P+'dynData',dynData)}
  if(d.sched){sched=d.sched;LS.set(P+'sched',sched)}
  renderTodos();renderNotes();renderSched();renderDynTabs();renderFeed('all');
}
function renderSyncMeta(){
  const c=getCfg();
  if(!c.owner&&!c.repo&&!c.token){setStatus('还没配置过云端，填入仓库信息再点同步。');return}
  const last=LS.get(P+'lastSync','');
  let html='仓库 <b>'+esc(c.owner)+'/'+esc(c.repo)+'</b>';
  if(c.owner&&!c.repo)html='只填了所有者，还差仓库名';
  if(last)html+='<br>上次同步：<b>'+esc(last)+'</b>';
  setStatus(html);
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function refreshSyncState(){
  const last=LS.get(P+'lastSync','');
  const state=$('#syncState');
  state.classList.remove('off');
  state.innerHTML=last?('<span class="dot"></span>已同步 '+esc(last)):'<span class="dot"></span>仅本机';
}
function backup(){
  const cfg=readInputs();
  if(!cfg.owner||!cfg.repo||!cfg.token)return toast('先把仓库和 Token 填好');
  setStatus('正在备份…');
  const body=JSON.stringify(collect(),null,2);
  fetch(dataUrl(cfg),apiOpt(cfg)).then(r=>{
    if(r.status===404)return null;
    if(!r.ok)throw new Error('读取失败 HTTP '+r.status);
    return r.json();
  }).then(f=>{
    const method=f?'PUT':'POST';
    const payload={message:'workbench backup '+(new Date().toISOString().slice(0,19)),content:b64(body)};
    if(f)payload.sha=f.sha;
    return fetch(dataUrl(cfg),apiOpt(cfg,{method,body:JSON.stringify(payload)}));
  }).then(r=>{
    if(!r.ok)throw new Error('上传失败 HTTP '+r.status);
    const t=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
    LS.set(P+'lastSync',t);saveCfg(readInputs());refreshSyncState();renderSyncMeta();
    toast('已备份到云端');
  }).catch(e=>{setStatus('备份失败：'+esc(e.message));toast('备份失败')});
}
function pull(){
  const cfg=readInputs();
  if(!cfg.owner||!cfg.repo||!cfg.token)return toast('先把仓库和 Token 填好');
  setStatus('正在拉取…');
  fetch(dataUrl(cfg),apiOpt(cfg)).then(r=>{
    if(!r.ok)throw new Error(r.status===404?'云端还没有数据文件，先备份一次':'拉取失败 HTTP '+r.status);
    return r.json();
  }).then(f=>{
    const text=decodeURIComponent(escape(atob(f.content.replace(/\n/g,''))));
    apply(JSON.parse(text));
    const t=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
    LS.set(P+'lastSync',t);saveCfg(readInputs());refreshSyncState();renderSyncMeta();
    toast('已从云端拉取');
  }).catch(e=>{setStatus(esc(e.message));toast(e.message.indexOf('备份')>-1?'云端暂无数据':'拉取失败')});
}
function saveCfg(c){LS.set(SYNC_KEY,{owner:c.owner,repo:c.repo,token:c.token})}
$('#syncBtn').addEventListener('click',()=>{
  const pnl=$('#syncPanel');pnl.classList.toggle('open');
  const c=getCfg();
  if(c.owner&&!$('#sOwner').value)$('#sOwner').value=c.owner;
  if(c.repo&&!$('#sRepo').value)$('#sRepo').value=c.repo;
  renderSyncMeta();
});
document.addEventListener('click',e=>{
  const pnl=$('#syncPanel');
  if(pnl.classList.contains('open')&&!pnl.contains(e.target)&&e.target.id!=='syncBtn'){
    pnl.classList.remove('open');
  }
});
$('#sBackup').addEventListener('click',backup);
$('#sPull').addEventListener('click',pull);
refreshSyncState();
renderSyncMeta();
</script>
</body>
</html>
