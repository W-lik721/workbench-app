name: hourly-hotlists
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: fetch hot lists
        run: |
          pip install --quiet curl_cffi
          python scripts/fetch_hotlists.py

      - name: commit and push
        run: |
          git config user.name "W-lik721"
          git config user.email "1667057579@qq.com"
          git add hotlists.json
          if git diff --cached --quiet; then
            echo "no change, skip commit"
          else
            git commit -m "chore(hotlists): hourly update"
            git push origin HEAD:main
          fi